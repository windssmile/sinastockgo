name: Build packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o sinago-windows-amd64.exe .

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: sinago-windows-amd64
          path: sinago-windows-amd64.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      CGO_ENABLED: 0
      VERSION: "1.5"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build DMG
        run: ./build-app.sh

      - name: Verify DMG
        run: hdiutil verify sinago-1.5-darwin-arm64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: sinago-darwin-arm64
          path: sinago-1.5-darwin-arm64.dmg
          if-no-files-found: error
